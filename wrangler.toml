# Cloudflare Workers 배포 설정.
#
# 이 파일이 없으면(이전 상태) "npx wrangler deploy"가 정적 파일만 올리는 배포로
# 떨어져서, functions/api/leaderboard.js 가 전혀 실행되지 않고 Settings 화면에도
# "정적 자산만 있는 Worker에는 바인딩을 추가할 수 없습니다"라고 표시된다.
# main(실제 Worker 코드)을 지정해야 D1 등 바인딩을 추가할 수 있는 "진짜" Worker가 된다.
#
# D1 바인딩: Cloudflare 대시보드에서 "formix-leaderboard" DB를 만들고 바인딩 추가한 뒤,
# 대시보드가 안내한 대로 이 파일에도 그대로 반영한 값이다. 이게 없으면 다음 배포
# (git push → wrangler deploy) 때 대시보드에서 추가한 바인딩이 덮어써질 수 있다.

name = "formix"
compatibility_date = "2026-10-12"
main = "src/index.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_id = "2d196000-0aeb-4c1f-be32-ac117bdfdc16"
