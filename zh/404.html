<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面未找到 | 网页工具箱</title>
<meta name="robots" content="noindex, follow" />
<link rel="stylesheet" href="/assets/css/style.css" />
<script>
  (function () {
    try {
      var t = localStorage.getItem("wtb-theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="nav-brand" href="/zh/">
      <span class="nav-brand-mark">W</span>
      网页工具箱
    </a>
  </div>
</header>
<main>
  <div class="container hero">
    <span class="eyebrow">404</span>
    <h1>页面未找到</h1>
    <p>您访问的页面可能已被删除或地址已更改。</p>
    <p style="margin-top: 24px;"><a class="btn btn-primary" href="/zh/">返回首页</a></p>
  </div>
</main>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/i18n.js"></script>
</body>
</html>
